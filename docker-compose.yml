x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *default-logging
    image: postgres:16
    container_name: iracing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iracing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iracing_local}
      POSTGRES_DB: ${POSTGRES_DB:-telemetry}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iracing} -d ${POSTGRES_DB:-telemetry}"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis:
    <<: *default-logging
    image: redis:alpine
    container_name: iracing-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 5

  api:
    <<: *default-logging
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: iracing-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-iracing}:${POSTGRES_PASSWORD:-iracing_local}@postgres:5432/${POSTGRES_DB:-telemetry}
      - REDIS_HOST=redis
      - API_KEY=${API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/status')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    <<: *default-logging
    build: ./frontend
    container_name: iracing-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata: